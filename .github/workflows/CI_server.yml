name: Ansible CI Server playbook

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ansible & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/

  test-dry-run:
    name: Test Playbooks in Check Mode
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Server.yml Playbook in Check Mode
        run: ansible-playbook ansible/playbooks/server.yml --check -i ansible/inventories/hosts.yml

      - name: Run hp.yml Playbook in Check Mode
        run: ansible-playbook ansible/playbooks/hp.yml --check -i ansible/inventories/hosts.yml

      - name: Run fedora.yml Playbook in Check Mode
        run: ansible-playbook ansible/playbooks/fedora.yml --check -i ansible/inventories/hosts.yml
