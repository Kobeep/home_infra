name: E2E Tests & Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ansible-syntax-check:
    name: Ansible Playbooks Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Ansible Syntax Checks
        shell: bash
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
        run: |
          set -euo pipefail

          playbooks=(
            ansible/playbooks/full-setup.yml
            ansible/playbooks/provision-cluster.yml
            ansible/playbooks/deploy-apps.yml
            ansible/playbooks/site.yml
          )

          for playbook in "${playbooks[@]}"; do
            echo "Checking $playbook"
            ansible-playbook -i ansible/inventory.yml "$playbook" --syntax-check
          done

          while IFS= read -r -d '' playbook; do
            echo "Checking $playbook"
            ansible-playbook -i ansible/inventory.yml "$playbook" --syntax-check
          done < <(find ansible/playbooks/apps -type f \( -iname '*.yml' -o -iname '*.yaml' \) -print0 | sort -z)

  lint-yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint yamlfix

      - name: Validate YAML formatting and linting
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t yaml_files < <(
            find ansible k8s \
              -type f \( -iname '*.yml' -o -iname '*.yaml' \) \
              ! -path '*/harbor/*' \
              ! -path '*/harbor' \
              -print | sort
          )

          if [ "${#yaml_files[@]}" -eq 0 ]; then
            echo "No static YAML files to lint."
            exit 0
          fi

          echo "Linting files:"
          printf ' - %s\n' "${yaml_files[@]}"

          yamlfix --check "${yaml_files[@]}"
          yamllint -c .yamllint "${yaml_files[@]}"

  secrets-check:
    name: Security & Secrets Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for tracked unencrypted secret files & raw private keys
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch ansible/env.cfg >/dev/null 2>&1; then
            if ! head -n 1 ansible/env.cfg | grep -q '^\$ANSIBLE_VAULT;'; then
              echo "ERROR: Unencrypted ansible/env.cfg is tracked in git repository!"
              exit 1
            fi
          fi

          echo "No tracked unencrypted secrets or raw private keys found."

  run-cluster-setup:
    name: Cluster Setup Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create local CI inventory for server group
        shell: bash
        run: |
          set -euo pipefail
          cat > inventory_ci.ini <<'EOF'
          [server]
          localhost ansible_connection=local ansible_become=true ansible_user=runner
          EOF

      - name: Run cluster installation playbook on localhost
        shell: bash
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          set -euo pipefail
          ansible-playbook -i inventory_ci.ini ansible/playbooks/provision-cluster.yml

      - name: Check cluster health
        shell: bash
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl get pods -A
