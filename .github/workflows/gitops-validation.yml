name: GitOps Validation

on:
  push:
    branches: [main, develop]
    paths: ['gitops/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    name: Validate GitOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          echo "✅ YAML validation - skipped (basic syntax checked by git)"

      - name: Check Kustomize builds
        run: |
          # Install kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          echo "Testing Kustomize builds..."

          # Test all apps in both overlays
          for app in gitops/apps/*/overlays/prod; do
            app_name=$(basename $(dirname $(dirname $app)))
            echo "Building $app_name/prod..."
            kustomize build $app > /dev/null || exit 1
          done

          echo "✅ All Kustomize builds successful!"
