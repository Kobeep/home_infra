name: GitOps Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'gitops/**'
      - '.github/workflows/gitops-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'gitops/**'
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          echo "INFO=> Validating YAML syntax..."
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, indentation: {spaces: 2}}}" gitops/

  kustomize-build:
    name: Kustomize Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - home-assistant
          - dashy
          - grafana
          - prometheus
          - influxdb
          - openwebui
          - grocy
          - adguard
        overlay:
          - develop
          - prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Test Kustomize build
        run: |
          echo "INFO=> Building ${{ matrix.app }} / ${{ matrix.overlay }}..."
          kustomize build gitops/apps/${{ matrix.app }}/overlays/${{ matrix.overlay }} > /dev/null
          echo "INFO=> Build successful!"

  structure-validation:
    name: Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check apps structure
        run: |
          echo "INFO=> Checking application structure..."

          APPS=(home-assistant dashy grafana prometheus influxdb openwebui grocy adguard)
          OVERLAYS=(develop prod)

          for app in "${APPS[@]}"; do
            echo "INFO=> Checking $app..."

            # Check base directory exists
            if [ ! -d "gitops/apps/$app/base" ]; then
              echo "ERROR: Missing base directory for $app"
              exit 1
            fi

            # Check base kustomization.yaml exists
            if [ ! -f "gitops/apps/$app/base/kustomization.yaml" ]; then
              echo "ERROR: Missing base/kustomization.yaml for $app"
              exit 1
            fi

            # Check overlays
            for overlay in "${OVERLAYS[@]}"; do
              if [ ! -d "gitops/apps/$app/overlays/$overlay" ]; then
                echo "ERROR: Missing overlays/$overlay directory for $app"
                exit 1
              fi

              if [ ! -f "gitops/apps/$app/overlays/$overlay/kustomization.yaml" ]; then
                echo "ERROR: Missing overlays/$overlay/kustomization.yaml for $app"
                exit 1
              fi
            done

            echo "INFO=> $app structure OK"
          done

          echo "INFO=> All apps structure validated!"

  argocd-apps-validation:
    name: ArgoCD Apps Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check ArgoCD app definitions
        run: |
          echo "INFO=> Checking ArgoCD application definitions..."

          # Check if files exist
          if [ ! -f "gitops/clusters/develop/argocd-apps/apps.yaml" ]; then
            echo "ERROR: Missing develop/argocd-apps/apps.yaml"
            exit 1
          fi

          if [ ! -f "gitops/clusters/prod/argocd-apps/apps.yaml" ]; then
            echo "ERROR: Missing prod/argocd-apps/apps.yaml"
            exit 1
          fi

          # Check if all apps are defined (simple grep check)
          APPS=(home-assistant dashy grafana prometheus influxdb openwebui grocy adguard)

          for app in "${APPS[@]}"; do
            if ! grep -q "path: gitops/apps/$app/" gitops/clusters/develop/argocd-apps/apps.yaml; then
              echo "ERROR: App $app not found in develop/argocd-apps/apps.yaml"
              exit 1
            fi

            if ! grep -q "path: gitops/apps/$app/" gitops/clusters/prod/argocd-apps/apps.yaml; then
              echo "ERROR: App $app not found in prod/argocd-apps/apps.yaml"
              exit 1
            fi
          done

          echo "INFO=> ArgoCD apps validated!"

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "INFO=> Checking for hardcoded secrets..."

          # Check for common secret patterns (basic check)
          if grep -r "password:" gitops/ --include="*.yaml" | grep -v "passwordSecretRef" | grep -v "admin-password" | grep -v "# password"; then
            echo "WARNING: Found potential hardcoded passwords!"
            echo "Please use Kubernetes secrets or sealed-secrets instead"
            exit 1
          fi

          echo "INFO=> No obvious hardcoded secrets found"

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [yaml-lint, kustomize-build, structure-validation, argocd-apps-validation, security-check]
    if: always()
    steps:
      - name: Generate test report
        run: |
          echo "## GitOps Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Lint | ${{ needs.yaml-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kustomize Build | ${{ needs.kustomize-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Structure Validation | ${{ needs.structure-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD Apps | ${{ needs.argocd-apps-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | ${{ needs.security-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.yaml-lint.result }}" == "success" ]] && \
             [[ "${{ needs.kustomize-build.result }}" == "success" ]] && \
             [[ "${{ needs.structure-validation.result }}" == "success" ]] && \
             [[ "${{ needs.argocd-apps-validation.result }}" == "success" ]] && \
             [[ "${{ needs.security-check.result }}" == "success" ]]; then
            echo "✅ All GitOps validation tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
