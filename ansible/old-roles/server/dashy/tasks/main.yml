---
- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ dashy_namespace }}"
    state: present

- name: Create Dashy config ConfigMap
  kubernetes.core.k8s:
    state: present
    namespace: "{{ dashy_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dashy-config
      data:
        conf.yml: |
          title: "{{ dashy_title }}"
          logo: "{{ dashy_logo }}"
          services:
            - name: Jenkins
              url: "http://192.168.0.122:8080"
            - name: Grafana
              url: "http://{{ ansible_default_ipv4.address }}:30002"
            - name: Home Assistant
              url: "http://{{ ansible_default_ipv4.address }}:8123"

- name: Deploy Dashy Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ dashy_namespace }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ dashy_service_name }}"
      spec:
        replicas: "{{ dashy_replicas }}"
        selector:
          matchLabels:
            app: dashy
        template:
          metadata:
            labels:
              app: dashy
          spec:
            containers:
              - name: dashy
                image: "{{ dashy_image }}"
                ports:
                  - containerPort: "{{ dashy_container_port }}"
                volumeMounts:
                  - name: dashy-config
                    mountPath: /app/public/conf.yml
                    subPath: conf.yml
            volumes:
              - name: dashy-config
                configMap:
                  name: dashy-config

- name: Expose Dashy via NodePort
  kubernetes.core.k8s:
    state: present
    namespace: "{{ dashy_namespace }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ dashy_service_name }}"
      spec:
        type: NodePort
        selector:
          app: dashy
        ports:
          - port: "{{ dashy_service_port }}"
            targetPort: "{{ dashy_container_port }}"
            nodePort: "{{ dashy_node_port }}"

- name: Deploy Ingress for Dashy
  kubernetes.core.k8s:
    state: present
    namespace: "{{ dashy_namespace }}"
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"
