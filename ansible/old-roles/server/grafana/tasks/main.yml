---
- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ grafana_namespace }}"
    state: present

- name: Create Grafana PVC
  kubernetes.core.k8s:
    state: present
    namespace: "{{ grafana_namespace }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ grafana_pvc_name }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ grafana_storage_size }}"

- name: Deploy Grafana Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ grafana_namespace }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ grafana_service_name }}"
      spec:
        replicas: "{{ grafana_replicas }}"
        selector:
          matchLabels:
            app: grafana
        template:
          metadata:
            labels:
              app: grafana
          spec:
            containers:
              - name: grafana
                image: "{{ grafana_image }}"
                ports:
                  - containerPort: "{{ grafana_container_port }}"
                env:
                  - name: GF_SECURITY_ADMIN_USER
                    value: "{{ grafana_admin_user }}"
                  - name: GF_SECURITY_ADMIN_PASSWORD
                    value: "{{ grafana_admin_password }}"
                volumeMounts:
                  - name: grafana-storage
                    mountPath: /var/lib/grafana
            volumes:
              - name: grafana-storage
                persistentVolumeClaim:
                  claimName: "{{ grafana_pvc_name }}"

- name: Expose Grafana via NodePort
  kubernetes.core.k8s:
    state: present
    namespace: "{{ grafana_namespace }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ grafana_service_name }}"
      spec:
        type: NodePort
        selector:
          app: grafana
        ports:
          - port: "{{ grafana_service_port }}"
            targetPort: "{{ grafana_container_port }}"
            nodePort: "{{ grafana_node_port }}"

- name: Deploy Ingress for Grafana
  kubernetes.core.k8s:
    state: present
    namespace: "{{ grafana_namespace }}"
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"
