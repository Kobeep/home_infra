---
- name: Build custom Jenkins Docker image
  community.docker.docker_image:
    name: jenkins-custom
    tag: latest
    build:
      path: "./build"
    source: build
    force_source: true

- name: Create Jenkins namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: jenkins
    state: present

- name: Add Jenkins Helm repo
  community.kubernetes.helm_repository:
    name: jenkins
    repo_url: https://charts.jenkins.io

- name: Deploy Jenkins using Helm with custom image
  community.kubernetes.helm:
    name: jenkins
    chart_ref: jenkins/jenkins
    release_namespace: jenkins
    values_file: "{{ role_path }}/files/values.yaml"
    create_namespace: false
    wait: true
