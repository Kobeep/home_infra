---
- name: Home Lab - Full Server Setup
  hosts: server
  become: true

  vars:
    k3s_version: v1.28.5+k3s1
    server_ip: "{{ ansible_default_ipv4.address }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - python3-pip
          - python3-kubernetes
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    # =====================================================
    # CLEANUP OLD K3D/DOCKER/IPTABLES
    # =====================================================
    - name: Uninstall existing K3S
      shell: |
        if [ -f /usr/local/bin/k3s-uninstall.sh ]; then
          /usr/local/bin/k3s-uninstall.sh
        fi
      ignore_errors: yes

    - name: Stop and remove k3d clusters
      shell: |
        if command -v k3d &> /dev/null; then
          k3d cluster delete --all || true
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.0.0 bash -s -- --remove || true
        fi
      ignore_errors: yes

    - name: Stop and remove Docker containers
      shell: |
        if command -v docker &> /dev/null; then
          docker stop $(docker ps -aq) 2>/dev/null || true
          docker rm -f $(docker ps -aq) 2>/dev/null || true
          docker network prune -f || true
          docker volume prune -f || true
        fi
      ignore_errors: yes

    - name: Clean iptables rules
      shell: |
        iptables -F
        iptables -X
        iptables -t nat -F
        iptables -t nat -X
        iptables -t mangle -F
        iptables -t mangle -X
        iptables -t raw -F
        iptables -t raw -X
        iptables -P INPUT ACCEPT
        iptables -P FORWARD ACCEPT
        iptables -P OUTPUT ACCEPT
      ignore_errors: yes

    - name: Remove k3d if installed
      apt:
        name: k3d
        state: absent
      ignore_errors: yes

    - name: Remove k3d binary
      file:
        path: /usr/local/bin/k3d
        state: absent
      ignore_errors: yes

    - name: Clean CNI configurations
      shell: |
        rm -rf /etc/cni/net.d/*
        rm -rf /opt/cni/bin/*
        rm -rf /var/lib/rancher/k3s/*
        rm -rf /var/lib/kubelet/*
        ip link delete cni0 2>/dev/null || true
        ip link delete flannel.1 2>/dev/null || true
      ignore_errors: yes

    - name: Reboot to clean network state
      reboot:
        msg: "Rebooting to clean all network configurations"
        pre_reboot_delay: 5

    - name: Wait for system to come back online
      wait_for_connection:
        delay: 30
        timeout: 300

      ignore_errors: yes

    # =====================================================    # K3S INSTALLATION
    # =====================================================
    - name: Check if K3s is installed
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik --tls-san {{ server_ip }}" sh -
      when: not k3s_binary.stat.exists

    - name: Wait for K3s to be ready
      wait_for:
        port: 6443
        delay: 5
        timeout: 60

    - name: Allow K3s API port through firewall (if ufw is active)
      ufw:
        rule: allow
        port: '6443'
        proto: tcp
        comment: 'K3S API Server'
      when: ansible_facts.services['ufw.service'] is defined
      ignore_errors: yes

    - name: Create .kube directory
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Copy kubeconfig
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: yes
        mode: '0600'

    # =====================================================
    # KUBECTL & HELM
    # =====================================================
    - name: Check if kubectl is installed
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_binary

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      when: not kubectl_binary.stat.exists

    - name: Check if helm is installed
      stat:
        path: /usr/local/bin/helm
      register: helm_binary

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_binary.stat.exists

    # =====================================================
    # CLONE HOME_INFRA REPOSITORY
    # =====================================================
    - name: Install git
      apt:
        name: git
        state: present

    - name: Clone home_infra repository
      git:
        repo: 'https://github.com/Kobeep/home_infra.git'
        dest: /root/home_infra
        version: main
        force: yes

    # =====================================================
    # DEPLOY ALL APPLICATIONS
    # =====================================================
    - name: Create all namespaces first
      shell: |
        kubectl apply -f /root/home_infra/k8s/jenkins/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/dashy/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/home-assistant/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/adguard/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/grafana/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/influxdb/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/openwebui/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/grocy/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/backup/namespace.yaml

    - name: Wait for namespaces to be ready
      shell: |
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/jenkins --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/dashy --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/home-assistant --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/adguard --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/monitoring --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/influxdb --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/openwebui --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/grocy --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/backup --timeout=30s

    - name: Deploy all K8s manifests
      shell: |
        kubectl apply -f /root/home_infra/k8s/jenkins/
        kubectl apply -f /root/home_infra/k8s/dashy/
        kubectl apply -f /root/home_infra/k8s/home-assistant/
        kubectl apply -f /root/home_infra/k8s/adguard/
        kubectl apply -f /root/home_infra/k8s/grafana/
        kubectl apply -f /root/home_infra/k8s/prometheus/
        kubectl apply -f /root/home_infra/k8s/influxdb/
        kubectl apply -f /root/home_infra/k8s/openwebui/
        kubectl apply -f /root/home_infra/k8s/grocy/
        kubectl apply -f /root/home_infra/k8s/backup/
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for all pods to be ready
      shell: kubectl wait --for=condition=ready pod --all --all-namespaces --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: yes

    # =====================================================
    # UPDATE DASHY CONFIG WITH SERVER IP
    # =====================================================
    - name: Update Dashy ConfigMap with server IP
      shell: |
        kubectl get configmap dashy-config -n dashy -o yaml | \
        sed "s/SERVER_IP/{{ server_ip }}/g" | \
        kubectl apply -f -
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Restart Dashy to apply changes
      shell: kubectl rollout restart deployment/dashy -n dashy
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # =====================================================
    # DISPLAY ACCESS INFO
    # =====================================================
    - name: Display access information
      debug:
        msg:
          - "=========================================="
          - "Home Lab Setup Complete!"
          - "=========================================="
          - ""
          - "Access your services at:"
          - "  Dashy Dashboard: http://{{ server_ip }}:30000"
          - "  Jenkins: http://{{ server_ip }}:30080"
          - "  Home Assistant: http://{{ server_ip }}:30123"
          - "  Grafana: http://{{ server_ip }}:30300"
          - "  Prometheus: http://{{ server_ip }}:30900"
          - "  AdGuard: http://{{ server_ip }}:30053"
          - "  OpenWebUI: http://{{ server_ip }}:30800"
          - "  Grocy: http://{{ server_ip }}:30180"
          - "  InfluxDB: http://{{ server_ip }}:30086"
          - ""
          - "Backup system (Cloud DR Orchestrator) deployed as CronJob"
          - "  Configure Oracle Cloud credentials in k8s/backup/secret.yaml"
          - ""
          - "Get Jenkins initial password:"
          - "  kubectl exec -n jenkins -it deployment/jenkins -- cat /var/jenkins_home/secrets/initialAdminPassword"
          - ""
          - "=========================================="
