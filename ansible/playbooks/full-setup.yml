---
# Home Lab - Full Server Provisioning

- name: Home Lab - Full Server Setup
  hosts: server
  become: true

  roles:
    - role: common          # apt packages, repo sync, cron bootstrap
    - role: k3s             # K3s install + kubeconfig for server user
    - role: kubectl_helm    # kubectl + helm binaries
    - role: apps            # render templates + deploy all K8s workloads

  post_tasks:
    - name: Display access information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Home Lab Setup Complete!"
          - "=========================================="
          - ""
          - "Server IP: {{ server_ip }}"
          - ""
          - "🌐 Access your services:"
          - "  🏠 Dashy:          https://dashy.{{ server_ip }}.nip.io"
          - "  🔧 Jenkins:        https://jenkins.{{ server_ip }}.nip.io"
          - "  🏡 Home Assistant: https://ha.{{ server_ip }}.nip.io"
          - "  📊 Grafana:        https://grafana.{{ server_ip }}.nip.io"
          - "  📈 Prometheus:     https://prometheus.{{ server_ip }}.nip.io"
          - "  🛡️  AdGuard:        https://adguard.{{ server_ip }}.nip.io"
          - "  💾 InfluxDB:       https://influxdb.{{ server_ip }}.nip.io"
          - "  🔐 Vault:          https://vault.{{ server_ip }}.nip.io"
          - "  🔍 API:            https://api.{{ server_ip }}.nip.io"
          - "  📚 OpenGrok:       https://opengrok.{{ server_ip }}.nip.io"
          - ""
          - "💡 Notes:"
          - "  • All kubectl commands can be run as the 'server' user"
          - "  • Vault must be manually initialized after first deploy"
          - "  • Run: kubectl exec -it vault-0 -n vault -- vault operator init"
          - ""
          - "=========================================="
