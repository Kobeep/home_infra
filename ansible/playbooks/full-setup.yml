---
- name: Home Lab - Full Server Setup
  hosts: server
  become: true

  vars:
    k3s_version: v1.28.5+k3s1
    server_ip: "{{ ansible_default_ipv4.address }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - python3-pip
          - python3-kubernetes
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    # =====================================================
    # K3S INSTALLATION
    # =====================================================
    - name: Check if K3s is installed
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik --tls-san {{ server_ip }} --node-external-ip {{ server_ip }}" sh -
      when: not k3s_binary.stat.exists

    - name: Wait for K3s to be ready
      wait_for:
        port: 6443
        delay: 5
        timeout: 60

    - name: Allow K3s API port through firewall (if ufw is active)
      ufw:
        rule: allow
        port: '6443'
        proto: tcp
        comment: 'K3S API Server'
      when: ansible_facts.services['ufw.service'] is defined
      ignore_errors: true

    - name: Allow HTTP/HTTPS ports for Ingress
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
      when: ansible_facts.services['ufw.service'] is defined
      ignore_errors: true

    - name: Create .kube directory
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: Copy kubeconfig
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: yes
        mode: '0600'

    # =====================================================
    # KUBECTL & HELM
    # =====================================================
    - name: Check if kubectl is installed
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_binary

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      when: not kubectl_binary.stat.exists

    - name: Check if helm is installed
      stat:
        path: /usr/local/bin/helm
      register: helm_binary

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_binary.stat.exists

    # =====================================================
    # CLONE HOME_INFRA REPOSITORY
    # =====================================================
    - name: Install git
      apt:
        name: git
        state: present

    - name: Copy home_infra repository from local
      synchronize:
        src: "{{ playbook_dir | dirname | dirname }}/"
        dest: /root/home_infra/

    # =====================================================
    # INSTALL INGRESS NGINX CONTROLLER
    # =====================================================
    - name: Check if ingress-nginx namespace exists
      shell: kubectl get namespace ingress-nginx
      register: ingress_ns
      failed_when: false
      changed_when: false
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Ingress NGINX Controller
      shell: |
        kubectl apply -k /root/home_infra/k8s/ingress-nginx/
      when: ingress_ns.rc != 0
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for Ingress NGINX Controller to be ready
      shell: |
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      retries: 3
      delay: 10
      register: result
      until: result.rc == 0

    # =====================================================
    # INSTALL CERT-MANAGER
    # =====================================================
    - name: Add Jetstack Helm Repo
      shell: helm repo add jetstack https://charts.jetstack.io && helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install cert-manager
      shell: |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for cert-manager webhooks to be ready
      shell: |
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=120s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # =====================================================
    # DEPLOY ALL APPLICATIONS
    # =====================================================
    - name: Create all namespaces first
      shell: |
        kubectl apply -f /root/home_infra/k8s/jenkins/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/dashy/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/home-assistant/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/adguard/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/grafana/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/influxdb/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/openwebui/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/grocy/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/backup/namespace.yaml
        kubectl apply -f /root/home_infra/k8s/vault/namespace.yaml

    - name: Wait for namespaces to be ready
      shell: |
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/jenkins --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/dashy --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/home-assistant --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/adguard --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/monitoring --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/influxdb --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/openwebui --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/grocy --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/backup --timeout=30s
        kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/vault --timeout=30s

    - name: Deploy all K8s manifests
      shell: kubectl apply -k /root/home_infra/k8s/
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml



    - name: Wait for all pods to be ready
      shell: kubectl wait --for=condition=ready pod --all --all-namespaces --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ignore_errors: true

    - name: Add Hashicorp Helm Repo
      shell: helm repo add hashicorp https://helm.releases.hashicorp.com && helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install HashiCorp Vault via Helm
      shell: |
        helm upgrade --install vault hashicorp/vault \
          --namespace vault \
          -f /root/home_infra/k8s/vault/values.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Add External Secrets Helm Repo
      shell: helm repo add external-secrets https://charts.external-secrets.io && helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install External Secrets Operator
      shell: helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace --set installCRDs=true
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # Omitted imperative Dashy and Ingress config patching in favor of declarative GitOpsYAML

    # =====================================================
    # DISPLAY ACCESS INFO
    # =====================================================
    - name: Display access information
      debug:
        msg:
          - "=========================================="
          - "Home Lab Setup Complete!"
          - "=========================================="
          - ""
          - "🌐 Access your services through Ingress NGINX:"
          - ""
          - "  🏠 Dashy Dashboard:  http://{{ server_ip }}/"
          - "  🔧 Jenkins:          http://{{ server_ip }}/jenkins"
          - "  🏡 Home Assistant:   http://{{ server_ip }}/homeassistant"
          - "  📊 Grafana:          http://{{ server_ip }}/grafana"
          - "  📈 Prometheus:       http://{{ server_ip }}/prometheus"
          - "  🛡️  AdGuard:          http://{{ server_ip }}/adguard"
          - "  🤖 OpenWebUI:        http://{{ server_ip }}/openwebui"
          - "  🛒 Grocy:            http://{{ server_ip }}/grocy"
          - "  💾 InfluxDB:         http://{{ server_ip }}/influxdb"
          - ""
          - "💡 Notes:"
          - "  • All services are accessible ONLY through Ingress (ports 80/443)"
          - "  • Services are ClusterIP type (no NodePort exposure)"
          - "  • Dashy dashboard is at the root path /"
          - "  • Health checks enabled for all services"
          - ""
          - "🔐 Jenkins Initial Setup:"
          - "  kubectl exec -n jenkins -it deployment/jenkins -- cat /var/jenkins_home/secrets/initialAdminPassword"
          - ""
          - "💾 Backup System:"
          - "  Cloud DR Orchestrator deployed as CronJob"
          - "  Configure Oracle Cloud credentials in k8s/backup/secret.yaml"
          - ""
          - "🔍 Useful Commands:"
          - "  kubectl get ingress -A           # View all Ingress rules"
          - "  kubectl get svc -A               # View all services"
          - "  kubectl get pods -A              # View all pods"
          - ""
          - "=========================================="
    - name: Clone home_infra repository to /home/$USER/home_infra
      git:
        repo: 'https://github.com/Kobeep/home_infra.git'
        dest: '/home/$USER/home_infra'

    - name: Run the startup hook script to set up cronjobs
      shell: /root/home_infra/bin/startuphook.py
      args:
        executable: /usr/bin/env python3
