---
- name: Setup Light Homelab with Docker Compose
  hosts: server
  become: true
  vars:
    homelab_base_dir: /opt/homelab
    homelab_user: "{{ ansible_user }}"
    homelab_timezone: "Europe/Warsaw"

    # Service ports
    homeassistant_port: 8123
    dashy_port: 4000
    grafana_port: 3000
    prometheus_port: 9090
    promtail_port: 9080
    loki_port: 3100
    jenkins_port: 8080
    jenkins_agent_port: 50000
    grocy_port: 9283

    # Data directories
    homeassistant_config: "{{ homelab_base_dir }}/homeassistant/config"
    grafana_data: "{{ homelab_base_dir }}/grafana/data"
    prometheus_data: "{{ homelab_base_dir }}/prometheus/data"
    prometheus_config: "{{ homelab_base_dir }}/prometheus/config"
    loki_data: "{{ homelab_base_dir }}/loki/data"
    promtail_config: "{{ homelab_base_dir }}/promtail/config"
    jenkins_home: "{{ homelab_base_dir }}/jenkins/home"
    jenkins_ssh: "{{ homelab_base_dir }}/jenkins/ssh"
    grocy_data: "{{ homelab_base_dir }}/grocy/data"
    dashy_config: "{{ homelab_base_dir }}/dashy"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - role: tools/docker
      tags: ['docker']

  tasks:
    - name: Create homelab base directory
      file:
        path: "{{ homelab_base_dir }}"
        state: directory
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0755'
      tags: ['setup']

    - name: Create service directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0755'
      loop:
        - "{{ homeassistant_config }}"
        - "{{ grafana_data }}"
        - "{{ prometheus_data }}"
        - "{{ prometheus_config }}"
        - "{{ loki_data }}"
        - "{{ promtail_config }}"
        - "{{ jenkins_home }}"
        - "{{ jenkins_ssh }}"
        - "{{ grocy_data }}"
        - "{{ dashy_config }}"
        - "{{ homelab_base_dir }}/jenkins"
        - "{{ homelab_base_dir }}/loki"
      tags: ['setup']

    - name: Deploy docker-compose.yml
      template:
        src: ../templates/homelab/docker-compose.yml.j2
        dest: "{{ homelab_base_dir }}/docker-compose.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['compose']

    - name: Check if Home Assistant configuration exists and is not empty
      stat:
        path: "{{ homeassistant_config }}/configuration.yaml"
      register: ha_config_stat
      tags: ['config', 'homeassistant']

    - name: Check Home Assistant configuration file size
      set_fact:
        ha_config_empty: "{{ ha_config_stat.stat.size | default(0) < 50 }}"
      when: ha_config_stat.stat.exists
      tags: ['config', 'homeassistant']

    - name: Set ha_config_empty if file doesn't exist
      set_fact:
        ha_config_empty: true
      when: not ha_config_stat.stat.exists
      tags: ['config', 'homeassistant']

    - name: Deploy Home Assistant configuration
      template:
        src: ../templates/homelab/homeassistant-configuration.yaml.j2
        dest: "{{ homeassistant_config }}/configuration.yaml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      when: ha_config_empty | default(false)
      tags: ['config', 'homeassistant']

    - name: Deploy Home Assistant auxiliary files
      template:
        src: "../templates/homelab/homeassistant-{{ item }}.yaml.j2"
        dest: "{{ homeassistant_config }}/{{ item }}.yaml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
        force: false
      loop:
        - automations
        - scripts
        - scenes
      tags: ['config', 'homeassistant']

    - name: Deploy Dashy configuration
      template:
        src: ../templates/homelab/dashy-conf.yml.j2
        dest: "{{ dashy_config }}/conf.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'dashy']

    - name: Deploy Prometheus configuration
      template:
        src: ../templates/homelab/prometheus.yml.j2
        dest: "{{ prometheus_config }}/prometheus.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'prometheus']

    - name: Deploy Promtail configuration
      template:
        src: ../templates/homelab/promtail-config.yml.j2
        dest: "{{ promtail_config }}/promtail-config.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'promtail']

    - name: Deploy Loki configuration
      template:
        src: ../templates/homelab/loki-config.yml.j2
        dest: "{{ homelab_base_dir }}/loki/loki-config.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'loki']

    - name: Deploy Grafana datasources configuration
      template:
        src: ../templates/homelab/grafana-datasources.yml.j2
        dest: "{{ grafana_data }}/datasources.yml"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'grafana']

    - name: Create Grafana dashboards provisioning directory
      file:
        path: "{{ grafana_data }}/dashboards"
        state: directory
        owner: "472"
        group: "472"
        mode: '0755'
      tags: ['config', 'grafana']

    - name: Deploy Grafana dashboard provisioning config
      copy:
        dest: "{{ grafana_data }}/dashboards/dashboards.yml"
        content: |
          apiVersion: 1
          providers:
            - name: 'Homelab'
              orgId: 1
              folder: 'Homelab'
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards
        owner: "472"
        group: "472"
        mode: '0644'
      tags: ['config', 'grafana']

    - name: Deploy Grafana Docker dashboard
      copy:
        src: ../templates/homelab/grafana-dashboard-docker.json
        dest: "{{ grafana_data }}/dashboards/docker.json"
        owner: "472"
        group: "472"
        mode: '0644'
      tags: ['config', 'grafana']

    - name: Deploy Grafana System dashboard
      copy:
        src: ../templates/homelab/grafana-dashboard-system.json
        dest: "{{ grafana_data }}/dashboards/system.json"
        owner: "472"
        group: "472"
        mode: '0644'
      tags: ['config', 'grafana']

    - name: Deploy Jenkins Dockerfile
      template:
        src: ../templates/homelab/jenkins-Dockerfile.j2
        dest: "{{ homelab_base_dir }}/jenkins/Dockerfile"
        owner: "{{ homelab_user }}"
        group: "{{ homelab_user }}"
        mode: '0644'
      tags: ['config', 'jenkins']

    - name: Deploy homelab management script
      template:
        src: ../templates/homelab/homelab-manage.sh.j2
        dest: /usr/local/bin/homelab
        owner: root
        group: root
        mode: '0755'
      tags: ['config', 'scripts']

    - name: Deploy config backup script
      template:
        src: ../templates/homelab/backup-configs.sh.j2
        dest: /usr/local/bin/homelab-backup-configs
        owner: root
        group: root
        mode: '0755'
      tags: ['config', 'scripts']

    - name: Add user to docker group
      user:
        name: "{{ homelab_user }}"
        groups: docker
        append: true
      tags: ['setup']

    - name: Fix permissions for Grafana data directory
      file:
        path: "{{ grafana_data }}"
        owner: "472"
        group: "472"
        mode: '0755'
        recurse: true
      tags: ['setup', 'permissions']

    - name: Fix permissions for Prometheus data directory
      file:
        path: "{{ prometheus_data }}"
        owner: "nobody"
        group: "nogroup"
        mode: '0755'
        recurse: true
      tags: ['setup', 'permissions']

    - name: Fix permissions for Loki data directory
      file:
        path: "{{ loki_data }}"
        owner: "10001"
        group: "10001"
        mode: '0755'
        recurse: true
      tags: ['setup', 'permissions']

    - name: Build Jenkins custom image
      command: docker compose build jenkins
      args:
        chdir: "{{ homelab_base_dir }}"
      register: build_result
      changed_when: "'Building' in build_result.stderr or 'built' in build_result.stdout"
      tags: ['docker', 'build']

    - name: Pull Docker images (exclude Jenkins)
      command: docker compose pull --ignore-buildable
      args:
        chdir: "{{ homelab_base_dir }}"
      changed_when: false
      tags: ['docker', 'pull']

    - name: Start homelab services
      command: docker compose up -d
      args:
        chdir: "{{ homelab_base_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'Creating' in compose_result.stdout"
      tags: ['start']

    - name: Wait for services to be healthy
      command: docker compose ps
      args:
        chdir: "{{ homelab_base_dir }}"
      register: services_status
      until: services_status.rc == 0
      retries: 5
      delay: 10
      changed_when: false
      tags: ['start', 'verify']

    - name: Display service URLs
      debug:
        msg:
          - "=== Homelab Services ==="
          - "Home Assistant: http://{{ ansible_host }}:{{ homeassistant_port }}"
          - "Dashy Dashboard: http://{{ ansible_host }}:{{ dashy_port }}"
          - "Grafana: http://{{ ansible_host }}:{{ grafana_port }}"
          - "Prometheus: http://{{ ansible_host }}:{{ prometheus_port }}"
          - "Jenkins: http://{{ ansible_host }}:{{ jenkins_port }}"
          - "Grocy: http://{{ ansible_host }}:{{ grocy_port }}"
          - ""
          - "To stop services: cd {{ homelab_base_dir }} && docker compose down"
          - "To view logs: cd {{ homelab_base_dir }} && docker compose logs -f"
      tags: ['start', 'verify']
