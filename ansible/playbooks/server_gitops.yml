---
# Ansible Playbook to setup GitOps infrastructure with k3d + ArgoCD
# This provisions a clean server with everything needed for Home Infrastructure
- name: Setup GitOps Infrastructure with k3d and ArgoCD
  hosts: server
  become: true
  vars:
    k3d_version: "v5.6.0"
    kubectl_version: "v1.28.0"
    helm_version: "v3.13.0"
    docker_compose_version: "v2.23.0"
    home_infra_repo: "git@github.com:Kobeep/home_infra.git"
    home_infra_branch: "main"
    gitops_user: "{{ ansible_user }}"

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - gnupg
          - lsb-release
          - python3-pip
          - jq
        state: present

  tasks:
    # Docker Installation
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ gitops_user }}"
        groups: docker
        append: true

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # kubectl Installation
    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /tmp/kubectl
        mode: '0755'

    - name: Install kubectl
      ansible.builtin.copy:
        src: /tmp/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'
        remote_src: true

    - name: Verify kubectl installation
      ansible.builtin.command: kubectl version --client
      register: kubectl_version_output
      changed_when: false

    # k3d Installation
    - name: Download k3d installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh
        dest: /tmp/k3d-install.sh
        mode: '0755'

    - name: Install k3d
      ansible.builtin.shell: |
        TAG={{ k3d_version }} /tmp/k3d-install.sh
      args:
        creates: /usr/local/bin/k3d

    - name: Verify k3d installation
      ansible.builtin.command: k3d version
      register: k3d_version_output
      changed_when: false

    # Helm Installation
    - name: Download Helm installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm.sh
        mode: '0755'

    - name: Install Helm
      ansible.builtin.shell: /tmp/get-helm.sh
      args:
        creates: /usr/local/bin/helm
      environment:
        DESIRED_VERSION: "{{ helm_version }}"

    - name: Verify Helm installation
      ansible.builtin.command: helm version
      register: helm_version_output
      changed_when: false

    # Setup GitOps repository
    - name: Create home-infra directory
      ansible.builtin.file:
        path: "/home/{{ gitops_user }}/home-infra"
        state: directory
        owner: "{{ gitops_user }}"
        group: "{{ gitops_user }}"
        mode: '0755'

    - name: Clone Home Infrastructure repository
      ansible.builtin.git:
        repo: "{{ home_infra_repo }}"
        dest: "/home/{{ gitops_user }}/home-infra"
        version: "{{ home_infra_branch }}"
        force: true
      become: true
      become_user: "{{ gitops_user }}"

    # Create persistent volumes directories
    - name: Create persistent volume directories
      ansible.builtin.file:
        path: "/var/lib/home-infra/{{ item }}"
        state: directory
        owner: "{{ gitops_user }}"
        group: "{{ gitops_user }}"
        mode: '0755'
      loop:
        - home-assistant
        - grafana
        - prometheus
        - influxdb
        - jenkins
        - adguard
        - openwebui
        - grocy
        - dashy

    # Make scripts executable
    - name: Make bootstrap scripts executable
      ansible.builtin.file:
        path: "/home/{{ gitops_user }}/home-infra/gitops/scripts/{{ item }}"
        mode: '0755'
      loop:
        - bootstrap.sh
        - destroy.sh
        - backup-pvcs.sh
        - restore-pvcs.sh
        - trigger-backup.sh
        - fix-iptables-on-boot.sh
        - fix-networking.sh

    # Install iptables fix systemd service
    - name: Copy iptables fix script to /usr/local/bin
      ansible.builtin.copy:
        src: "/home/{{ gitops_user }}/home-infra/gitops/scripts/fix-iptables-on-boot.sh"
        dest: /usr/local/bin/fix-iptables-k3d.sh
        mode: '0755'
        remote_src: true

    - name: Copy iptables fix systemd service
      ansible.builtin.copy:
        src: "/home/{{ gitops_user }}/home-infra/gitops/systemd/fix-iptables-k3d.service"
        dest: /etc/systemd/system/fix-iptables-k3d.service
        mode: '0644'
        remote_src: true

    - name: Enable and start iptables fix service
      ansible.builtin.systemd:
        name: fix-iptables-k3d
        enabled: true
        daemon_reload: true

    # Check if cluster already exists
    - name: Check if k3d cluster exists
      ansible.builtin.shell: |
        k3d cluster list | grep -q "home-{{ cluster_mode | default('prod') }}"
      become: true
      become_user: "{{ gitops_user }}"
      register: cluster_exists
      changed_when: false
      failed_when: false

    # Bootstrap clusters
    - name: Bootstrap k3d clusters with ArgoCD
      ansible.builtin.shell: |
        cd /home/{{ gitops_user }}/home-infra/gitops
        ./scripts/bootstrap.sh {{ cluster_mode | default('prod') }}
      become: true
      become_user: "{{ gitops_user }}"
      environment:
        KUBECONFIG: "/home/{{ gitops_user }}/.kube/config"
      async: 1800  # 30 minutes timeout
      poll: 10     # Check every 10 seconds
      register: bootstrap_result
      when: cluster_exists.rc != 0 or force_bootstrap | default(false)

    # Setup kubectl config
    - name: Ensure .kube directory exists
      ansible.builtin.file:
        path: "/home/{{ gitops_user }}/.kube"
        state: directory
        owner: "{{ gitops_user }}"
        group: "{{ gitops_user }}"
        mode: '0700'

    - name: Set correct permissions on kubeconfig
      ansible.builtin.file:
        path: "/home/{{ gitops_user }}/.kube/config"
        owner: "{{ gitops_user }}"
        group: "{{ gitops_user }}"
        mode: '0600'
      when: not ansible_check_mode

    # # Wait for ArgoCD to sync all applications
    # - name: Wait for ArgoCD applications to sync
    #   ansible.builtin.shell: |
    #     kubectl wait --for=condition=Synced application --all -n argocd --timeout=300s --context k3d-home-{{ cluster_mode | default('prod') }}
    #   become: true
    #   become_user: "{{ gitops_user }}"
    #   register: argocd_apps_synced
    #   retries: 3
    #   delay: 30
    #   failed_when: false
    #   changed_when: false
    #   when: not ansible_check_mode

    # # Wait for pods to be ready before restoring
    # - name: Wait for all service pods to be ready
    #   ansible.builtin.shell: |
    #     for ns in home-assistant dashy monitoring adguard openwebui grocy; do
    #       echo "Waiting for pods in namespace: $ns"
    #       kubectl wait --for=condition=Ready pods --all -n $ns --timeout=300s --context k3d-home-{{ cluster_mode | default('prod') }} 2>/dev/null || echo "No pods in $ns yet"
    #     done
    #   become: true
    #   become_user: "{{ gitops_user }}"
    #   register: pods_ready
    #   retries: 3
    #   delay: 30
    #   failed_when: false
    #   changed_when: false
    #   when: not ansible_check_mode

    # # Restore backups if available
    # - name: Check if backup data exists
    #   ansible.builtin.stat:
    #     path: "/home/{{ gitops_user }}/home-infra/{{ item }}"
    #   loop:
    #     - hass-config
    #     - dashy-config
    #     - grafana-config
    #     - adguard-config
    #     - openwebui-config
    #   register: backup_dirs
    #   become: true
    #   become_user: "{{ gitops_user }}"

    # - name: Count available backups
    #   ansible.builtin.set_fact:
    #     backup_count: "{{ backup_dirs.results | selectattr('stat.exists') | list | length }}"

    # - name: Display backup status
    #   ansible.builtin.debug:
    #     msg: "Found {{ backup_count }}/5 backup directories available for restore"

    # - name: Restore service configurations from backups
    #   ansible.builtin.shell: |
    #     cd /home/{{ gitops_user }}/home-infra/gitops
    #     CLUSTER_NAME=home-{{ cluster_mode | default('prod') }} ./scripts/restore-pvcs.sh
    #   become: true
    #   become_user: "{{ gitops_user }}"
    #   environment:
    #     KUBECONFIG: "/home/{{ gitops_user }}/.kube/config"
    #   register: restore_result
    #   when:
    #     - not ansible_check_mode
    #     - backup_count | int > 0
    #     - restore_backups | default(true)
    #   failed_when: false  # Don't fail playbook if restore has issues

    # - name: Display restore result
    #   ansible.builtin.debug:
    #     msg: "{{ restore_result.stdout_lines }}"
    #   when:
    #     - restore_result is defined
    #     - restore_result.stdout_lines is defined

  post_tasks:
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "================================================"
          - "GitOps Infrastructure Setup Complete! 🚀"
          - "================================================"
          - ""
          - "Installed components:"
          - "  ✓ Docker {{ docker_compose_version }}"
          - "  ✓ kubectl {{ kubectl_version }}"
          - "  ✓ k3d {{ k3d_version }}"
          - "  ✓ Helm {{ helm_version }}"
          - ""
          - "k3d Clusters:"
          - "  - home-prod (Production)"
          - "  - home-develop (Development) - if bootstrapped both"
          - ""
          - "ArgoCD is installed and managing applications via GitOps"
          - ""
          - "Next steps:"
          - "  1. SSH to server: ssh {{ gitops_user }}@{{ ansible_host }}"
          - "  2. Check cluster status: ~/home-infra/gitops/scripts/status.sh"
          - "  3. Port-forward ArgoCD:"
          - "     kubectl port-forward svc/argocd-server -n argocd 8080:443 --context k3d-home-prod"
          - "  4. Get ArgoCD password:"
          - "     kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
          - ""
          - "Repository: /home/{{ gitops_user }}/home-infra"
          - "GitOps directory: /home/{{ gitops_user }}/home-infra/gitops"
          - ""

    - name: Wait for ArgoCD initial admin secret to be created
      ansible.builtin.command: |
        kubectl get secret argocd-initial-admin-secret -n argocd --context k3d-home-prod
      become: true
      become_user: "{{ gitops_user }}"
      register: argocd_secret_check
      until: argocd_secret_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Save ArgoCD credentials
      ansible.builtin.shell: |
        kubectl config use-context k3d-home-prod
        ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "N/A")
        echo "ArgoCD Admin Password: $ARGOCD_PASSWORD" > /home/{{ gitops_user }}/argocd-credentials.txt
        chmod 600 /home/{{ gitops_user }}/argocd-credentials.txt
      become: true
      become_user: "{{ gitops_user }}"
      when:
        - not ansible_check_mode
        - argocd_secret_check is defined
        - argocd_secret_check.rc == 0
      changed_when: true
      failed_when: false
