---
# Role: infra_api
# Deploys Homelab API application manifests via Kustomize.

- name: Render Infra API Jinja2 templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - src: "{{ home_infra_local_path }}/k8s/infra-api/ingress.yaml.j2"
      dest: "{{ home_infra_remote_path }}/k8s/infra-api/ingress.yaml"
    - src: "{{ home_infra_local_path }}/k8s/infra-api/deployment.yaml.j2"
      dest: "{{ home_infra_remote_path }}/k8s/infra-api/deployment.yaml"

- name: Deploy Infra API K8s manifests via Kustomize
  become: false
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/apply_kustomize.sh {{ home_infra_remote_path }}/k8s/infra-api"
  environment: "{{ kubectl_env }}"
  changed_when: true
