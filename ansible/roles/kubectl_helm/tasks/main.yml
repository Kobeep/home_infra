---
# Role: kubectl_helm
# Installs kubectl and helm binaries to /usr/local/bin.

- name: Check if kubectl is installed
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: kubectl_binary

- name: Get latest stable kubectl version string
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: kubectl_stable_version
  when: not kubectl_binary.stat.exists

- name: Download and install kubectl
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/install_kubectl.sh '{{ kubectl_stable_version.content | trim }}'"
  when: not kubectl_binary.stat.exists
  changed_when: true

- name: Check if helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Install Helm via official script
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/install_helm.sh"
  when: not helm_binary.stat.exists
  changed_when: true
