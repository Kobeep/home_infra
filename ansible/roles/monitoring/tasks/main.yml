---
# Role: monitoring
# Deploys Grafana, InfluxDB, and Prometheus monitoring stack via Kustomize.

- name: Render Monitoring Jinja2 templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - src: "{{ home_infra_local_path }}/k8s/grafana/ingress.yaml.j2"
      dest: "{{ home_infra_remote_path }}/k8s/grafana/ingress.yaml"
    - src: "{{ home_infra_local_path }}/k8s/influxdb/ingress.yaml.j2"
      dest: "{{ home_infra_remote_path }}/k8s/influxdb/ingress.yaml"
    - src: "{{ home_infra_local_path }}/k8s/prometheus/ingress.yaml.j2"
      dest: "{{ home_infra_remote_path }}/k8s/prometheus/ingress.yaml"

- name: Deploy Grafana K8s manifests via Kustomize
  become: false
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/apply_kustomize.sh {{ home_infra_remote_path }}/k8s/grafana"
  environment: "{{ kubectl_env }}"
  changed_when: true

- name: Deploy InfluxDB K8s manifests via Kustomize
  become: false
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/apply_kustomize.sh {{ home_infra_remote_path }}/k8s/influxdb"
  environment: "{{ kubectl_env }}"
  changed_when: true

- name: Deploy Prometheus K8s manifests via Kustomize
  become: false
  ansible.builtin.script: "{{ home_infra_local_path }}/ansible/scripts/apply_kustomize.sh {{ home_infra_remote_path }}/k8s/prometheus"
  environment: "{{ kubectl_env }}"
  changed_when: true
