---
- name: Deploy custom iptables rules for Docker and SSH
  ansible.builtin.template:
    src: iptables.sh.j2
    dest: "{{ firewall_rules_script_path }}"
    mode: '0755'

- name: Execute Docker chain iptables script
  ansible.builtin.command:
    cmd: "{{ firewall_rules_script_path }}"
  register: iptables_result
  changed_when: iptables_result.rc == 0

- name: Ensure /etc/iptables directory exists
  ansible.builtin.file:
    path: /etc/iptables
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Save current iptables rules
  ansible.builtin.command:
    cmd: iptables-save
  register: iptables_rules
  changed_when: false

- name: Persist iptables rules
  ansible.builtin.copy:
    dest: "{{ firewall_rules_persist_path }}"
    content: "{{ iptables_rules.stdout }}"
    owner: root
    group: root
    mode: '0644'
