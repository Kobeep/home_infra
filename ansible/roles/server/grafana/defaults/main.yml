---
# Grafana deployment defaults
grafana_namespace: monitoring
grafana_replicas: 1
grafana_image: "grafana/grafana:latest"

# Service configuration
grafana_service_name: grafana
grafana_service_port: 80
grafana_container_port: 3000
grafana_node_port: 30002

# Ingress configuration
grafana_host: grafana.kobeeq.eu
grafana_ingress_name: grafana-ingress
grafana_ingress_class: traefik
grafana_tls_secret: grafana-tls

# Storage configuration
grafana_storage_size: "5Gi"
grafana_pvc_name: grafana-pvc

# Admin credentials (should be overridden with vault)
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password | default('changeme') }}"
