---
- name: Check if home-assistant Helm release exists
  ansible.builtin.shell: helm --kubeconfig /root/.kube/config status home-assistant -n {{ homeassistant_namespace }}
  register: home_assistant_status
  ignore_errors: true
  changed_when: false
  when: homeassistant_cleanup_old_release | bool

- name: Uninstall old Helm release if present
  ansible.builtin.shell: helm --kubeconfig /root/.kube/config uninstall home-assistant -n {{ homeassistant_namespace }}
  when:
    - homeassistant_cleanup_old_release | bool
    - home_assistant_status.rc == 0

- name: Delete old home-assistant resources
  ansible.builtin.shell: |
    kubectl --kubeconfig /root/.kube/config delete deployment {{ homeassistant_service_name }} \
      svc {{ homeassistant_service_name }} pvc {{ homeassistant_pvc_name }} \
      -n {{ homeassistant_namespace }} --ignore-not-found
  ignore_errors: true
  changed_when: false
  when: homeassistant_cleanup_old_release | bool

- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ homeassistant_namespace }}"
    state: present

- name: Create Home-Assistant PVC
  kubernetes.core.k8s:
    state: present
    namespace: "{{ homeassistant_namespace }}"
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ homeassistant_pvc_name }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ homeassistant_storage_size }}"

- name: Deploy Home-Assistant Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ homeassistant_namespace }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ homeassistant_service_name }}"
      spec:
        replicas: "{{ homeassistant_replicas }}"
        selector:
          matchLabels:
            app: home-assistant
        template:
          metadata:
            labels:
              app: home-assistant
          spec:
            containers:
              - name: home-assistant
                image: "{{ homeassistant_image }}"
                ports:
                  - containerPort: "{{ homeassistant_service_port }}"
                volumeMounts:
                  - name: config
                    mountPath: /config
            volumes:
              - name: config
                persistentVolumeClaim:
                  claimName: "{{ homeassistant_pvc_name }}"

- name: Expose Home-Assistant via NodePort
  kubernetes.core.k8s:
    state: present
    namespace: "{{ homeassistant_namespace }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ homeassistant_service_name }}"
      spec:
        type: NodePort
        selector:
          app: home-assistant
        ports:
          - port: "{{ homeassistant_service_port }}"
            targetPort: "{{ homeassistant_service_port }}"
            nodePort: "{{ homeassistant_node_port }}"

- name: Deploy Ingress for Home Assistant
  kubernetes.core.k8s:
    state: present
    namespace: "{{ homeassistant_namespace }}"
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"
