---
- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ollama_namespace }}"
    state: present

- name: Create PVC for ollama data
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ollama-data-pvc
        namespace: "{{ ollama_namespace }}"
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ ollama_pvc_size }}"
        storageClassName: "{{ ollama_storage_class }}"

- name: Deploy secret (OpenAI API key) if provided
  when: gpt3o_api_key != ""
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'secret.yml.j2') | from_yaml }}"

- name: Deploy Ollama (with automatic pull)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ollama-deploy.yml.j2') }}"


- name: Deploy OpenWebUI
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'openwebui-deploy.yml.j2') }}"

- name: Deploy Ingress for OpenWebUI
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"
