apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ ollama_namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
          - containerPort: 11434
        volumeMounts:
          - name: ollama-data
            mountPath: /root/.ollama
        command: ["ollama", "serve"]
      initContainers:
      - name: pull-model
        image: ollama/ollama:latest
        command: ["ollama", "pull", "{{ ollama_model }}"]
      volumes:
        - name: ollama-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ ollama_namespace }}
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
