---
- name: Remove old openwebui deployment
  kubernetes.core.k8s:
    state: absent
    kind: Deployment
    namespace: "{{ ollama_namespace }}"
    name: openwebui
  ignore_errors: true

- name: Remove old ollama deployment
  kubernetes.core.k8s:
    state: absent
    kind: Deployment
    namespace: "{{ ollama_namespace }}"
    name: ollama
  ignore_errors: true

- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ollama_namespace }}"
    state: present

- name: Create k8s secret for API keys
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ai-api-keys
        namespace: "{{ ollama_namespace }}"
      type: Opaque
      stringData:
        OPENAI_API_KEY: "{{ openai_api_key | default('') }}"
        GOOGLE_API_KEY: "{{ google_api_key | default('') }}"

- name: Deploy OpenWebUI (with PVC)
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'openwebui-deploy.yml.j2') | from_yaml_all }}"

- name: Deploy Ingress for OpenWebUI
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"

- name: Wait for OpenWebUI pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ ollama_namespace }}"
    label_selectors:
      - app=openwebui
  register: openwebui_pods
  until: openwebui_pods.resources | length > 0 and openwebui_pods.resources[0].status.phase == "Running"
  retries: 30
  delay: 10

- name: Add OpenAI model to OpenWebUI
  uri:
    url: "http://{{ openwebui_pods.resources[0].status.podIP }}:8080/api/admin/models"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json"
    body:
      name: "gpt-4o"
      provider: "openai"
      config:
        api_key: "{{ openai_api_key }}"
  when: openai_api_key is defined and openai_api_key | length > 0

- name: Add Gemini model to OpenWebUI
  uri:
    url: "http://{{ openwebui_pods.resources[0].status.podIP }}:8080/api/admin/models"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json"
    body:
      name: "gemini-2.5-pro"
      provider: "google"
      config:
        api_key: "{{ google_api_key }}"
  when: google_api_key is defined and google_api_key | length > 0
