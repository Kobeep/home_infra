# classify.conf
# Format: group|match_field|pattern
#   match_field is one of: hostname | vendor | ip
#   pattern is a case-insensitive substring match
#   Rules are checked top to bottom, first match wins.
#   Anything matching nothing falls into DEFAULT_GROUP (set in the script).
#
# Add a new device type by adding a line here — no script edits needed.

# --- Priority overrides ---
# Some vendors (Apple, Google, HP, Samsung...) make both phones AND
# computers/other gear, so a MAC vendor lookup alone can't tell them apart.
# These hostname-based rules MUST stay above the generic vendor rules
# further down, since the first match wins.
pc|hostname|macbook
pc|hostname|imac
pc|hostname|mac-mini
pc|hostname|mbp
phone|hostname|iphone
phone|hostname|ipad
phone|hostname|ipod
phone|hostname|pixel
