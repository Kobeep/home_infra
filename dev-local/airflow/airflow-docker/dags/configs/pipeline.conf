  owner = "data_team"

  tasks = [
    {
      id = "pobierz_jar_z_artifactory"
      type = "bash"
      command = "echo 'Symulacja: Pobieranie app-1.0.jar z Artifactory...'"
    },
    {
      id = "uruchom_flink_job"
      type = "python"
      message = "Symulacja: Uruchamianie zadania w Flinku na podstawie pliku HOCON"
    },
    {
      id = "wyslij_powiadomienie"
      type = "bash"
      command = "echo 'Pipeline zakończony sukcesem!'"
    }
  ]
}
