---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-bot
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-bot-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-bot-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-bot-role
subjects:
  - kind: ServiceAccount
    name: backup-bot
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: default
data:
  backup-pvcs.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    # GitOps PVC Backup Script (CronJob version)
    # Backs up persistent data from all user-facing services
    # Version: 1.0.0

    # Configuration
    BACKUP_DIR="/backups"
    TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
    BACKUP_ARCHIVE="${BACKUP_DIR}/backup_${TIMESTAMP}.tar.gz"

    # Namespace mappings
    NAMESPACE_HA="home-assistant"
    NAMESPACE_DASHY="dashy"
    NAMESPACE_GRAFANA="monitoring"
    NAMESPACE_ADGUARD="adguard"
    NAMESPACE_OPENWEBUI="openwebui"

    log_info() {
        echo "[INFO] $(date '+%Y-%m-%d %H:%M:%S') - $*"
    }

    log_error() {
        echo "[ERROR] $(date '+%Y-%m-%d %H:%M:%S') - $*" >&2
    }

    # Find first running pod matching fragment
    find_pod() {
        kubectl -n "$1" get pods --no-headers 2>/dev/null \
            | awk "/$2/ && \$3 == \"Running\" {print \$1; exit}"
    }

    # Backup directory from pod to local archive
    backup_dir() {
        local ns=$1
        local fragment=$2
        local remotepath=$3
        local local_subdir=$4

        log_info "Backing up ${ns}/${fragment}:${remotepath}"

        local pod=$(find_pod "${ns}" "${fragment}")

        if [[ -z "${pod}" ]]; then
            log_error "Pod not found or not running: ${ns}/${fragment}"
            return 1
        fi

        local backup_path="${BACKUP_DIR}/${local_subdir}"
        mkdir -p "${backup_path}"

        kubectl -n "${ns}" exec "${pod}" -- tar cf - -C "${remotepath}" . \
            | tar xf - -C "${backup_path}"

        if [[ $? -eq 0 ]]; then
            log_info "  ✓ Backup successful"
        else
            log_error "  ✗ Backup failed"
            return 1
        fi
    }

    # Backup single file from pod
    backup_file() {
        local ns=$1
        local fragment=$2
        local remotefile=$3
        local localfile=$4

        log_info "Backing up ${ns}/${fragment}:${remotefile}"

        local pod=$(find_pod "${ns}" "${fragment}")

        if [[ -z "${pod}" ]]; then
            log_error "Pod not found or not running: ${ns}/${fragment}"
            return 1
        fi

        mkdir -p "$(dirname "${localfile}")"

        kubectl -n "${ns}" exec "${pod}" -- cat "${remotefile}" > "${localfile}"

        if [[ $? -eq 0 ]]; then
            log_info "  ✓ Backup successful"
        else
            log_error "  ✗ Backup failed"
            return 1
        fi
    }

    # Main backup process
    main() {
        log_info "=== Starting Backup Process ==="

        mkdir -p "${BACKUP_DIR}"

        # Create temp directory for this backup
        local temp_dir="${BACKUP_DIR}/temp_${TIMESTAMP}"
        mkdir -p "${temp_dir}"
        cd "${temp_dir}"

        # Backup each service (continue on failure)
        backup_dir "${NAMESPACE_HA}" "home-assistant" "/config" "hass-config" || true
        backup_file "${NAMESPACE_DASHY}" "dashy" "/app/public/conf.yml" "dashy-config/conf.yml" || true
        backup_dir "${NAMESPACE_GRAFANA}" "grafana" "/var/lib/grafana" "grafana-config" || true
        backup_dir "${NAMESPACE_ADGUARD}" "adguard" "/opt/adguardhome/work" "adguard-config/work" || true
        backup_dir "${NAMESPACE_ADGUARD}" "adguard" "/opt/adguardhome/conf" "adguard-config/conf" || true
        backup_dir "${NAMESPACE_OPENWEBUI}" "openwebui" "/app/backend/data" "openwebui-config" || true

        # Create compressed archive
        log_info "Creating backup archive: ${BACKUP_ARCHIVE}"
        cd "${BACKUP_DIR}"
        tar czf "${BACKUP_ARCHIVE}" -C "${temp_dir}" .

        # Cleanup temp directory
        rm -rf "${temp_dir}"

        # Show backup size
        local size=$(du -sh "${BACKUP_ARCHIVE}" | cut -f1)
        log_info "Backup archive created: ${BACKUP_ARCHIVE} (${size})"

        # Keep only last 7 backups
        log_info "Cleaning old backups (keeping last 7)..."
        cd "${BACKUP_DIR}"
        ls -t backup_*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm -f

        log_info "=== Backup Process Completed ==="
        log_info "Current backups:"
        ls -lh "${BACKUP_DIR}"/backup_*.tar.gz 2>/dev/null || log_info "  (none)"
    }

    main "$@"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: default
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  # Keep last 3 successful jobs
  successfulJobsHistoryLimit: 3
  # Keep last 3 failed jobs
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Retry failed backups
      backoffLimit: 2
      # Timeout after 1 hour
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: pvc-backup
        spec:
          serviceAccountName: backup-bot
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: bitnami/kubectl:latest
              command:
                - /bin/bash
                - /scripts/backup-pvcs.sh
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: backup-script
              configMap:
                name: backup-script
                defaultMode: 0755
            - name: backups
              hostPath:
                path: /var/lib/home-infra/backups
                type: DirectoryOrCreate
