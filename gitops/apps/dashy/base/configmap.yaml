apiVersion: v1
kind: ConfigMap
metadata:
  name: dashy-config
data:
  conf.yml: |
    pageInfo:
      title: Home Infrastructure Dashboard
      description: GitOps Home Lab - k3d + ArgoCD
      navLinks:
        - title: GitHub
          path: https://github.com/Kobeep/Home_infra
        - title: ArgoCD
          path: http://argocd.local

    appConfig:
      theme: matrix
      layout: auto
      iconSize: medium
      language: pl

    sections:
      - name: Core Services
        icon: fas fa-server
        items:
          - title: Home Assistant
            description: Smart Home Platform
            icon: favicon
            url: http://home-assistant.home-assistant.svc.cluster.local:8123
            target: newtab

          - title: AdGuard Home
            description: Network-wide DNS and Ad Blocker
            icon: favicon
            url: http://adguard.adguard.svc.cluster.local:3000
            target: newtab

      - name: Monitoring & Observability
        icon: fas fa-chart-line
        items:
          - title: Grafana
            description: Metrics Visualization
            icon: favicon
            url: http://grafana.grafana.svc.cluster.local:3000
            target: newtab

          - title: Prometheus
            description: Metrics Collection
            icon: favicon
            url: http://prometheus.prometheus.svc.cluster.local:9090
            target: newtab

      - name: Data & Storage
        icon: fas fa-database
        items:
          - title: InfluxDB
            description: Time Series Database
            icon: favicon
            url: http://influxdb.influxdb.svc.cluster.local:8086
            target: newtab

      - name: Applications
        icon: fas fa-cubes
        items:
          - title: OpenWebUI
            description: AI Chat Interface
            icon: favicon
            url: http://openwebui.openwebui.svc.cluster.local:8080
            target: newtab

          - title: Grocy
            description: Grocery & Household Management
            icon: favicon
            url: http://grocy.grocy.svc.cluster.local:80
            target: newtab

      - name: GitOps
        icon: fas fa-code-branch
        items:
          - title: ArgoCD
            description: GitOps Continuous Delivery
            icon: favicon
            url: http://argocd.local
            target: newtab
