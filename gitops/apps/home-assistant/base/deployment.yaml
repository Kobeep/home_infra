apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      initContainers:
      - name: config-setup
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          if [ ! -f /config/configuration.yaml ]; then
            echo "Creating initial configuration.yaml"
            cp /config-template/configuration.yaml /config/configuration.yaml
          else
            # Check if http configuration exists
            if ! grep -q "use_x_forwarded_for" /config/configuration.yaml; then
              echo "Adding reverse proxy configuration to existing configuration.yaml"
              cat >> /config/configuration.yaml << 'EOF'

          # HTTP Configuration for reverse proxy
          http:
            use_x_forwarded_for: true
            trusted_proxies:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 172.19.0.0/16
          EOF
            else
              echo "Reverse proxy configuration already exists"
            fi
          fi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-template
          mountPath: /config-template
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
          name: http
          protocol: TCP
        env:
        - name: TZ
          value: "Europe/Warsaw"
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-config
      - name: config-template
        configMap:
          name: home-assistant-config
