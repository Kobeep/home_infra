---
# Ingress NGINX Controller for develop
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kobeep/Home_infra.git
    targetRevision: main
    path: gitops/platform/ingress-nginx
    helm:
      valueFiles:
        - values-develop.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

