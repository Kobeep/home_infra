---
# Ingress NGINX Controller for develop
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kobeep/Home_infra.git
    targetRevision: main
    path: gitops/platform/ingress-nginx
    helm:
      valueFiles:
        - values-develop.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Cert-Manager for SSL/TLS certificates
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kobeep/Home_infra.git
    targetRevision: main
    path: gitops/platform/cert-manager
    helm:
      valueFiles:
        - values-develop.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Let's Encrypt ClusterIssuers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: letsencrypt-issuers-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kobeep/Home_infra.git
    targetRevision: main
    path: gitops/platform/cert-manager/clusterissuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
  - group: cert-manager.io
    kind: ClusterIssuer
    jsonPointers:
    - /status

