# Development cluster: 1 server + 1 agent for testing
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: home-develop

servers: 1
agents: 1

ports:
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
  - port: 8443:30443
    nodeFilters:
      - loadbalancer
  - port: 30000-30010:30000-30010
    nodeFilters:
      - server:0

image: rancher/k3s:v1.28.5-k3s1

options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false

  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*

    nodeLabels:
      - label: environment=develop
        nodeFilters:
          - server:*
          - agent:*

network: home-develop-network

registries:
  create:
    name: home-develop-registry
    host: "0.0.0.0"
    hostPort: "5000"

  config: |
    mirrors:
      "localhost:5000":
        endpoint:
          - http://home-develop-registry:5000
