---
# Home Assistant - Home automation
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kobeep/Home_infra.git
    targetRevision: main
    path: gitops/apps/home-assistant/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

