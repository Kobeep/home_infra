# Production cluster: 1 server + 2 agents for home infrastructure
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: home-prod

servers: 1
agents: 2

ports:
  - port: 80:80
    nodeFilters:
      - server:0
      - agent:*
  - port: 443:443
    nodeFilters:
      - server:0
      - agent:*
  - port: 31000-31010:31000-31010
    nodeFilters:
      - server:0
  # Home Assistant
  - port: 8123:8123
    nodeFilters:
      - loadbalancer
  # Jenkins
  - port: 8081:8080
    nodeFilters:
      - loadbalancer

image: rancher/k3s:v1.28.5-k3s1

options:
  k3d:
    wait: true
    timeout: "180s"
    disableLoadbalancer: false

  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
      - arg: --kube-apiserver-arg=audit-log-path=/var/log/kubernetes/audit.log
        nodeFilters:
          - server:*

    nodeLabels:
      - label: environment=prod
        nodeFilters:
          - server:*
          - agent:*
      - label: workload=home-infrastructure
        nodeFilters:
          - agent:*

network: home-prod-network

volumes:
  # Persistent volumes for home applications
  - volume: /var/lib/home-infra/home-assistant:/home-assistant
    nodeFilters:
      - agent:*
  - volume: /var/lib/home-infra/grafana:/grafana
    nodeFilters:
      - agent:*
  - volume: /var/lib/home-infra/prometheus:/prometheus
    nodeFilters:
      - agent:*
  - volume: /var/lib/home-infra/influxdb:/influxdb
    nodeFilters:
      - agent:*
  - volume: /var/lib/home-infra/jenkins:/jenkins
    nodeFilters:
      - agent:*
  - volume: /var/lib/home-infra/adguard:/adguard
    nodeFilters:
      - agent:*

registries:
  create:
    name: home-prod-registry
    host: "0.0.0.0"
    hostPort: "5001"

  config: |
    mirrors:
      "localhost:5001":
        endpoint:
          - http://home-prod-registry:5001
