# Development environment values for Ingress NGINX
ingress-nginx:
  controller:
    replicaCount: 1

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    service:
      type: LoadBalancer
      externalTrafficPolicy: Local

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    config:
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"
      use-proxy-protocol: "false"
