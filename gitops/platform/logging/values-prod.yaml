# Production environment values for logging stack
loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: true
      size: 20Gi
    config:
      limits_config:
        retention_period: 720h  # 30 days
      compactor:
        retention_enabled: true
        retention_delete_delay: 2h
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  promtail:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  grafana:
    enabled: false  # Using main Grafana instance
