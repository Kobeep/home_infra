# Development environment values for monitoring stack
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 5Gi

  grafana:
    enabled: true
    adminPassword: admin123
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi

    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana-dev.local
      path: /
      pathType: Prefix

  alertmanager:
    enabled: false
