# Production environment values for monitoring stack
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 15d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 20Gi

  grafana:
    enabled: true
    adminPassword: admin123
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi

    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.kobeep.pl
      path: /
      pathType: Prefix
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.kobeep.pl

    # Disable default datasources from kube-prometheus-stack
    defaultDashboardsEnabled: false
    sidecar:
      datasources:
        enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - name: Prometheus
          type: prometheus
          url: http://monitoring-prod-kube-prome-prometheus.monitoring:9090
          access: proxy
          isDefault: true
        - name: Alertmanager
          type: alertmanager
          url: http://monitoring-prod-kube-prome-alertmanager.monitoring:9093
          access: proxy
          isDefault: false

  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 2Gi

  # Disable node-exporter for k3d (hostPath mount issues)
  prometheus-node-exporter:
    enabled: false
