apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
  namespace: backup
data:
  config.yaml: |
    oracle_cloud:
      namespace: "your-namespace"
      bucket_name: "homelab-backups"
      region: "us-ashburn-1"

    encryption:
      enabled: true
      algorithm: "AES-256-GCM"

    postgres:
      - name: "influxdb"
        host: "influxdb.influxdb.svc.cluster.local"
        port: 5432
        database: "metrics"
        user: "admin"

    files:
      - name: "k8s-configs"
        paths:
          - "/backups/k8s"
      - name: "jenkins-home"
        paths:
          - "/backups/jenkins"

    retention:
      days: 30
      keep_weekly: 4
      keep_monthly: 6
