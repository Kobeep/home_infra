apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-daily
  namespace: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: ghcr.io/kobeep/cloud-dr-orchestrator:latest
            command:
              - /app/orchestrator
              - backup
              - --config
              - /config/config.yaml
            volumeMounts:
            - name: config
              mountPath: /config
            - name: oci-config
              mountPath: /root/.oci
            - name: backup-storage
              mountPath: /backups
            env:
            - name: OCI_CLI_USER
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: oci-user-ocid
            - name: OCI_CLI_TENANCY
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: oci-tenancy-ocid
            - name: OCI_CLI_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: oci-fingerprint
            - name: OCI_CLI_KEY_CONTENT
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: oci-private-key
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: encryption-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-secrets
                  key: postgres-password
          volumes:
          - name: config
            configMap:
              name: backup-config
          - name: oci-config
            secret:
              secretName: backup-secrets
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
