apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: backup
type: Opaque
stringData:
  # Oracle Cloud credentials
  oci-user-ocid: "ocid1.user.oc1..your-user-ocid"
  oci-tenancy-ocid: "ocid1.tenancy.oc1..your-tenancy-ocid"
  oci-fingerprint: "your-fingerprint"
  oci-private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    your-private-key-here
    -----END RSA PRIVATE KEY-----

  # Encryption key
  encryption-key: "your-32-character-encryption-key"

  # Database passwords
  postgres-password: "your-postgres-password"
