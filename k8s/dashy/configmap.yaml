apiVersion: v1
kind: ConfigMap
metadata:
  name: dashy-config
  namespace: dashy
data:
  conf.yml: |
    pageInfo:
      title: 🏠 Home Lab Dashboard
      description: Twoje centrum zarządzania infrastrukturą domową
      navLinks:
        - title: GitHub
          path: https://github.com
        - title: Documentation
          path: https://dashy.to/docs

    appConfig:
      theme: matrix
      layout: auto
      iconSize: large
      language: pl
      statusCheck: true
      statusCheckInterval: 60
      disableUpdateChecks: false
      enableFontAwesome: true
      fontAwesomeKey: # Opcjonalnie: dodaj swój klucz Font Awesome Pro
      faviconApi: google

      # Ustawienia wyglądu
      customCss: |
        :root {
          --curve-factor: 10px;
          --dimming-factor: 0.7;
        }

      # Opcje bezpieczeństwa
      auth:
        enableGuestAccess: true

    sections:
      - name: 🚀 Infrastructure & CI/CD
        icon: fas fa-server
        displayData:
          collapsed: false
          rows: 1
          cols: 2
        items:
          - title: Jenkins
            description: Automatyzacja CI/CD Pipeline
            icon: hl-jenkins
            url: http://jenkins.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            statusCheckUrl: http://jenkins.192.168.1.24.nip.io
            tags: [CI/CD, Build, Deploy]

          - title: InfluxDB
            description: Time Series Database
            icon: hl-influxdb
            url: http://influxdb.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            tags: [Database, Metrics]

      - name: 🏡 Smart Home
        icon: fas fa-home
        displayData:
          collapsed: false
          rows: 1
          cols: 2
        items:
          - title: Home Assistant
            description: Centrum sterowania Smart Home
            icon: hl-home-assistant
            url: http://ha.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            statusCheckUrl: http://ha.192.168.1.24.nip.io
            tags: [Smart Home, Automation, IoT]

          - title: AdGuard Home
            description: Blokada reklam i DNS
            icon: hl-adguard-home
            url: http://adguard.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            statusCheckUrl: http://adguard.192.168.1.24.nip.io
            tags: [DNS, Security, Ad-Block]

      - name: 📊 Monitoring & Analytics
        icon: fas fa-chart-line
        displayData:
          collapsed: false
          rows: 1
          cols: 2
        items:
          - title: Grafana
            description: Dashboardy i wizualizacje
            icon: hl-grafana
            url: http://grafana.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            statusCheckUrl: http://grafana.192.168.1.24.nip.io/api/health
            tags: [Monitoring, Dashboards, Visualization]

          - title: Prometheus
            description: Metryki i alerty
            icon: hl-prometheus
            url: http://prometheus.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            statusCheckUrl: http://prometheus.192.168.1.24.nip.io/-/healthy
            tags: [Metrics, Monitoring, Alerts]

      - name: 🤖 Applications
        icon: fas fa-cubes
        displayData:
          collapsed: false
          rows: 2
          cols: 2
        items:
          - title: Open WebUI
            description: Interfejs AI Chat (Ollama/OpenAI)
            icon: hl-chatgpt
            url: http://openwebui.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            tags: [AI, Chat, LLM]

          - title: Grocy
            description: Zarządzanie gospodarstwem domowym
            icon: hl-grocy
            url: http://grocy.192.168.1.24.nip.io
            target: newtab
            statusCheck: true
            tags: [Grocery, Management, ERP]

      - name: 🔧 System & Tools
        icon: fas fa-tools
        displayData:
          collapsed: true
          rows: 1
        items:
          - title: Kubernetes Dashboard
            description: Zarządzanie klastrem K8s
            icon: hl-kubernetes
            url: http://SERVER_IP:30001
            target: newtab
            tags: [Kubernetes, Management]

          - title: Portainer
            description: Docker Management UI
            icon: hl-portainer
            url: http://SERVER_IP:9000
            target: newtab
            tags: [Docker, Containers]

      - name: 📚 Documentation
        icon: fas fa-book
        displayData:
          collapsed: true
        items:
          - title: Home Infra Docs
            description: Dokumentacja projektu
            icon: fas fa-file-code
            url: https://github.com/Kobeep/home_infra
            target: newtab

          - title: Kubernetes Docs
            description: Oficjalna dokumentacja K8s
            icon: hl-kubernetes
            url: https://kubernetes.io/docs/
            target: newtab
