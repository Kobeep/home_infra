apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [security]
    admin_user = Kobeep
    admin_password = admin
    disable_initial_admin_creation = false

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Admin

    [auth]
    disable_login_form = false

  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: GET

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: monitoring
        orgId: 1
        folder: "Monitoring"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
