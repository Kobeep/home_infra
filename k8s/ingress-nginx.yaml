apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
# Ingress dla Dashy - dashy.192.168.1.16.nip.io
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashy-ingress
  namespace: dashy
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: dashy.192.168.1.16.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashy
            port:
              number: 80
---
