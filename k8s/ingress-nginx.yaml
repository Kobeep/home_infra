apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
# Ingress dla Dashy (namespace: dashy)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashy-ingress
  namespace: dashy
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashy
            port:
              number: 80
---
# Ingress dla Jenkins (namespace: jenkins)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
  namespace: jenkins
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /jenkins(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: jenkins
            port:
              number: 8080
---
# Ingress dla Monitoring (namespace: monitoring - Grafana i Prometheus)
