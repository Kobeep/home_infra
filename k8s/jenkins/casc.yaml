jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "Kobeep"
          password: "${KOBEEP_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "devops"
            description: "Full access to Jenkins for DevOps team"
            permissions:
              - "Overall/Administer"
              - "Overall/Read"
            entries:
              - user: "Kobeep"
  kubernetes:
    cloud:
      name: "kubernetes"
      namespace: "jenkins"
      serverUrl: "https://kubernetes.default.svc"
      skipTlsVerify: true
      jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
      containerCapStr: "10"
      templates:
        - name: "jenkins-agent"
          label: "jnlp"
          containers:
            - name: "jnlp"
              image: "jenkins/inbound-agent:latest"
              alwaysPullImage: true
              workingDir: "/home/jenkins/agent"
